# Rust workspace: everything that touches radios or must run tiny and always-on.
[workspace]
resolver = "2"
members = ["cli", "mesh", "beacon", "firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
